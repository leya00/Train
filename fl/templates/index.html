<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Train Detection System</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <h1>Federated Learning Inference Interface</h1>

    <div class="container">
      <h2>Model Status</h2>
      <div id="model-info">Loading model information...</div>
    </div>

    <div class="container">
      <h2>Upload & Process</h2>
      
      <div class="model-selector">
        <h3>Select Model</h3>
        <select id="model-select">
          <option value="">Loading models...</option>
        </select>
      </div>
      
      <div class="upload-container" id="upload-area">
        <p>Drop files here or click to upload</p>
        <p>
          <small
            >Supports images (.jpg, .jpeg, .png) and videos (.mp4, .avi,
            .mov)</small
          >
        </p>
        <input
          type="file"
          id="file-input"
          multiple
          accept=".jpg,.jpeg,.png,.mp4,.avi,.mov"
          style="display: none"
        />
      </div>
      <button id="run-inference-btn" disabled>Process Files</button>
      <div id="upload-status" style="text-align: center; margin-top: 10px;"></div>
    </div>

    <div class="container hidden" id="results-section">
      <h2>Results</h2>
      <div class="batch-metrics" id="batch-metrics"></div>
      <div id="results-container"></div>
    </div>

    <div class="loading hidden" id="loading">
      <div
        id="loadingTweet"
        class="tweet hidden"
        role="status"
        aria-live="polite"
        aria-hidden="true"
      >
        <div class="tweet__body">
          <div class="tweet__header">
            <strong>Federated Bot</strong> <span>@fl_client</span> ·
            <span>now</span>
          </div>
          <div class="tweet__text">
            <span id="tweetText">Processing files</span
            ><span class="dots"
              ><span>.</span><span>.</span><span>.</span></span
            >
          </div>
        </div>
      </div>
    </div>

    <script>
      // DOM elements
      const modelInfoEl = document.getElementById("model-info");
      const modelSelect = document.getElementById("model-select");
      const uploadArea = document.getElementById("upload-area");
      const fileInput = document.getElementById("file-input");
      const runInferenceBtn = document.getElementById("run-inference-btn");
      const uploadStatus = document.getElementById("upload-status");
      const resultsSection = document.getElementById("results-section");
      const resultsContainer = document.getElementById("results-container");
      const loadingEl = document.getElementById("loading");
      const batchMetricsEl = document.getElementById("batch-metrics");

      // Selected files
      let selectedFiles = [];
      let selectedModel = "";

      // Load model info when page loads
      window.addEventListener("DOMContentLoaded", () => {
        loadModelInfo();
        loadModels();
      });

      // Set up file upload handlers
      uploadArea.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", handleFileSelect);
      uploadArea.addEventListener("dragover", (e) => {
        e.preventDefault();
        uploadArea.style.borderColor = "#4CAF50";
      });
      uploadArea.addEventListener("dragleave", () => {
        uploadArea.style.borderColor = "#ccc";
      });
      uploadArea.addEventListener("drop", (e) => {
        e.preventDefault();
        uploadArea.style.borderColor = "#ccc";
        handleFileSelect({ target: { files: e.dataTransfer.files } });
      });

      // Run inference button
      runInferenceBtn.addEventListener("click", runInference);
      
      // Model select handler
      modelSelect.addEventListener("change", function() {
        selectedModel = this.value;
        localStorage.setItem("selectedModel", selectedModel);
        runInferenceBtn.disabled = !selectedFiles.length || !selectedModel;
      });

      // Function to load model info
      async function loadModelInfo() {
        try {
          const response = await fetch("/model-info");
          const data = await response.json();

          // Create HTML for model info
          let html = `
                    <div class="metrics-container">
                        <div class="metric-card">
                            <h3>Model Name</h3>
                            <div>${
                              data.model_manager_info && data.model_manager_info.name
                                ? data.model_manager_info.name
                                : data.model_name
                            }</div>
                        </div>
                        <div class="metric-card">
                            <h3>Model Type</h3>
                            <div>${data.model_type}</div>
                        </div>
                        <div class="metric-card">
                            <h3>Status</h3>
                            <div>${data.model_status}</div>
                        </div>
                    </div>
                    
                    <h3>Current Federated Learning Status</h3>
                    <div class="metrics-container">
                        <div class="metric-card">
                            <h3>Training Status</h3>
                            <div>${
                              data.federated_metrics.training_status ||
                              "Unknown"
                            }</div>
                        </div>
                        <div class="metric-card">
                            <h3>Current Round</h3>
                            <div class="metric-value">${
                              data.federated_metrics.epochs || 0
                            }/${data.federated_metrics.total_rounds || 0}</div>
                        </div>
                        <div class="metric-card">
                            <h3>Clients Connected</h3>
                            <div class="metric-value">${
                              data.federated_metrics.clients_connected || 0
                            }</div>
                        </div>
                        <div class="metric-card">
                            <h3>Current Accuracy</h3>
                            <div class="metric-value">${(
                              data.federated_metrics.precision * 100
                            ).toFixed(2)}%</div>
                        </div>
                        <div class="metric-card">
                            <h3>Current Loss</h3>
                            <div class="metric-value">${data.federated_metrics.box_loss.toFixed(
                              4
                            )}</div>
                        </div>
                        <div class="metric-card">
                            <h3>Inferences Processed</h3>
                            <div class="metric-value">${
                              data.federated_metrics.inference_count || 0
                            }</div>
                        </div>
                        <div class="metric-card">
                            <h3>Last Update</h3>
                            <div>${
                              data.model_manager_info && data.model_manager_info.loaded_at
                                ? new Date(data.model_manager_info.loaded_at).toLocaleTimeString()
                                : data.federated_metrics.last_update || "Never"
                            }</div>
                        </div>
                    </div>
                `;

          modelInfoEl.innerHTML = html;
        } catch (error) {
          modelInfoEl.innerHTML = `<p>Error loading model info: ${error.message}</p>`;
        }
      }

      // Function to load available models
      async function loadModels() {
        try {
          const response = await fetch("/models");
          const data = await response.json();
          
          // Clear existing options
          modelSelect.innerHTML = "";
          
          // Add default option
          const defaultOption = document.createElement("option");
          defaultOption.value = "";
          defaultOption.textContent = "Select a model...";
          modelSelect.appendChild(defaultOption);
          
          // Add models from server
          if (data.models && data.models.length > 0) {
            data.models.forEach(model => {
              const option = document.createElement("option");
              option.value = model.file;
              option.textContent = model.name;
              modelSelect.appendChild(option);
            });
          }
          
          // Set previously selected model if available
          const savedModel = localStorage.getItem("selectedModel");
          if (savedModel) {
            modelSelect.value = savedModel;
            selectedModel = savedModel;
          }
        } catch (error) {
          console.error("Error loading models:", error);
        }
      }
      
      // Function to handle file selection
      function handleFileSelect(event) {
        const files = event.target.files;
        if (!files.length) return;

        selectedFiles = Array.from(files);
        uploadStatus.innerHTML = `Selected ${selectedFiles.length} file(s)`;
        runInferenceBtn.disabled = !selectedModel;
      }

      // Function to run inference
      async function runInference() {
        if (!selectedFiles.length) return;

        // Show loading
        loadingEl.classList.remove("hidden");
        showLoadingTweet();
        uploadStatus.innerHTML = "Processing files...";
        resultsSection.classList.add("hidden");
        runInferenceBtn.disabled = true;

        // Create form data
        const formData = new FormData();
        selectedFiles.forEach((file) => {
          formData.append("files", file);
        });
        
        // Add selected model if available
        if (selectedModel) {
          formData.append("model_file", selectedModel);
        }

        try {
          // Send request
          const response = await fetch("/run-inference", {
            method: "POST",
            body: formData,
          });

          if (!response.ok) {
            throw new Error(
              `Server returned ${response.status}: ${response.statusText}`
            );
          }

          const data = await response.json();
          displayResults(data);

          // Refresh model info to show updated metrics
          loadModelInfo();
        } catch (error) {
          uploadStatus.innerHTML = `Error: ${error.message}`;
        } finally {
          loadingEl.classList.add("hidden");
          hideLoadingTweet();
          runInferenceBtn.disabled = false;
        }
      }

      // Function to display results
      function displayResults(data) {
        resultsSection.classList.remove("hidden");

        // Display batch metrics
        const batchMetrics = data.batch_metrics;
        batchMetricsEl.innerHTML = `
                <h3>Results</h3>
                <div class="metrics-container">
                    <div class="metric-card">
                        <h3>Precision</h3>
                        <div class="metric-value">${(
                          batchMetrics.precision * 100
                        ).toFixed(2)}%</div>
                    </div>
                    <div class="metric-card">
                        <h3>Recall</h3>
                        <div class="metric-value">${(
                          batchMetrics.recall * 100
                        ).toFixed(2)}%</div>
                    </div>
                    <div class="metric-card">
                        <h3>F1 Score</h3>
                        <div class="metric-value">${(
                          batchMetrics.f1_score * 100
                        ).toFixed(2)}%</div>
                    </div>
                    <div class="metric-card">
                        <h3>Total Detections</h3>
                        <div class="metric-value">${data.total_detections}</div>
                    </div>
                    <div class="metric-card">
                        <h3>Model Used</h3>
                        <div class="metric-value">${data.model_info ? data.model_info.name : "Default"}</div>
                    </div>
                </div>
                
                ${
                  data.object_summary &&
                  Object.keys(data.object_summary).length > 0
                    ? `
                <h3>Objects Detected Summary</h3>
                <div class="detection-list">
                    ${Object.entries(data.object_summary)
                      .map(
                        ([className, count]) =>
                          `<div class="detected-object">
                            <span class="object-name">${className}</span>: 
                            <span class="object-count">${count}</span>
                        </div>`
                      )
                      .join("")}
                </div>`
                    : ""
                }
            `;

        // Display individual results
        let resultsHtml = "";

        data.results.forEach((result) => {
          const isVideo =
            result.output_path.endsWith(".mp4") ||
            result.output_path.endsWith(".avi") ||
            result.output_path.endsWith(".mov");

          resultsHtml += `
                    <div class="result-item">
                        <h3>${result.filename}</h3>
                        <p>Detections: ${
                          result.detections
                        } | Processing Time: ${result.processing_time.toFixed(
            2
          )}s</p>
                        <p>Precision: ${(result.precision * 100).toFixed(
                          2
                        )}% | Recall: ${(result.recall * 100).toFixed(
            2
          )}% | F1: ${(result.f1_score * 100).toFixed(2)}%</p>
                        
                        <!-- Detection Summary -->
                        <div class="detection-summary">
                            <h4>Objects Detected:</h4>
                            <div class="detection-list">
                                ${
                                  result.detected_objects
                                    ? Object.entries(result.detected_objects)
                                        .map(
                                          ([className, count]) =>
                                            `<div class="detected-object">
                                            <span class="object-name">${className}</span>: 
                                            <span class="object-count">${count}</span>
                                        </div>`
                                        )
                                        .join("")
                                    : '<div class="no-detections">No objects detected</div>'
                                }
                            </div>
                        </div>
                        
                        ${
                          isVideo
                            ? `<div class="video-container">
                                <video controls>
                                    <source src="${result.output_path}" type="video/mp4">
                                    Your browser does not support the video tag.
                                </video>
                            </div>`
                            : `<div class="image-container">
                                <img src="${result.output_path}" alt="Inference result" style="max-width: 100%; max-height: 400px;">
                            </div>`
                        }
                    </div>
                `;
        });

        // Display errors if any
        if (data.errors && data.errors.length) {
          resultsHtml += "<h3>Errors</h3>";
          data.errors.forEach((error) => {
            resultsHtml += `<div class="result-item error">
                        <p>${error.filename}: ${error.error}</p>
                    </div>`;
          });
        }

        resultsContainer.innerHTML = resultsHtml;
      }
      // --- Tweet loading animation ---
      const LOADING_LINES = [
        "Processing files",
        "Sharding to clients",
        "Running local inference",
        "Aggregating updates",
        "Averaging weights",
        "Cleaning up temporary blobs",
        "Almost there",
      ];

      let tweetTimer = null;
      let idx = 0;

      function showLoadingTweet() {
        const el = document.getElementById("loadingTweet");
        const text = document.getElementById("tweetText");
        idx = 0;
        text.textContent = LOADING_LINES[idx];
        clearInterval(tweetTimer);
        tweetTimer = setInterval(() => {
          idx++;
          text.textContent = LOADING_LINES[idx % LOADING_LINES.length];
        }, 1600);
        el.classList.remove("hidden");
        requestAnimationFrame(() => el.classList.add("show"));
      }

      function hideLoadingTweet() {
        const el = document.getElementById("loadingTweet");
        clearInterval(tweetTimer);
        el.classList.remove("show");
        setTimeout(() => el.classList.add("hidden"), 240);
      }
    </script>
  </body>
</html>
